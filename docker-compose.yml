services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine-api:
    build: .
    image: workflow-engine:latest
    environment:
      ENGINE_ROLE: api
      SPRING_PROFILES_ACTIVE: api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workflow
      SPRING_DATASOURCE_USERNAME: workflow
      SPRING_DATASOURCE_PASSWORD: workflow
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  engine-worker:
    image: workflow-engine:latest
    environment:
      ENGINE_ROLE: worker
      SPRING_PROFILES_ACTIVE: worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workflow
      SPRING_DATASOURCE_USERNAME: workflow
      SPRING_DATASOURCE_PASSWORD: workflow
    depends_on:
      engine-api:
        condition: service_healthy

volumes:
  pgdata:
